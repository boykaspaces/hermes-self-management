AWSTemplateFormatVersion: "2010-09-09"
Description: Minimal Hermes Agent host on EC2 with SSM and ChatGPT subscription-backed OpenAI Codex access.

Parameters:
  ProjectTag:
    Type: String
    Default: hermes-self-management
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9_.:/+=@-]{1,126}$'
    Description: Neutral project tag applied to created resources.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that contains the selected subnet.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with outbound internet access. Pin this explicitly so rebuilds do not depend on the default subnet.

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
    Description: t3.small supports the current low-concurrency headless browser workload; use t3.medium for concurrent browser sessions.

  RootVolumeSize:
    Type: Number
    Default: 20
    MinValue: 12
    MaxValue: 100
    Description: Encrypted gp3 root volume size in GiB.

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Explicitly selected and reviewed Ubuntu 24.04 LTS x86_64 AMI for the target Region.

  HermesGitRef:
    Type: String
    Default: 29112bef099274229cadff79cdff7bf7b99c4b77
    AllowedPattern: "^[0-9a-f]{40}$"
    ConstraintDescription: Must be a full 40-character Git commit SHA.
    Description: Exact Hermes Agent source revision verified in production.

  AWSCLIVersion:
    Type: String
    Default: 2.36.23
    AllowedPattern: "^2\\.[0-9]+\\.[0-9]+$"
    ConstraintDescription: Must be an AWS CLI v2 semantic version such as 2.36.23.
    Description: Exact AWS CLI v2 version used for Secrets Manager, SSM Parameter, S3 restore, and CloudFormation signaling.

  OpenAICodexModel:
    Type: String
    Default: gpt-5.6-sol
    AllowedPattern: "^[A-Za-z0-9._:-]+$"
    ConstraintDescription: Must be a plain OpenAI Codex model identifier without spaces or path separators.
    Description: OpenAI Codex model selected from the authenticated ChatGPT account catalog. Override this parameter if the account exposes a different model.

  TelegramEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the production Telegram channel. Keep false for a parallel rebuild until cutover.

  TelegramRuntimeSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$"
    ConstraintDescription: Must be empty or a complete Secrets Manager secret ARN.
    Description: JSON secret containing TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS, TELEGRAM_HOME_CHANNEL, and optional TELEGRAM_HOME_CHANNEL_THREAD_ID.

  PersonalToolsMCPURL:
    Type: String
    Default: ""
    AllowedPattern: '^$|^https://\S+/mcp$'
    ConstraintDescription: Must be empty or an HTTPS MCP endpoint ending in /mcp.
    Description: Optional Personal Tools MCP Streamable HTTP endpoint.

  PersonalToolsClientTokenSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$"
    ConstraintDescription: Must be empty or a complete Secrets Manager secret ARN.
    Description: Existing Personal Tools client-token Secret. Its value is synchronized before Gateway start and never stored in this template.

  GitCodingEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the restricted-network coding container and short-lived GitHub credential lease client.

  CredentialLeaseApiId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9]{10}$'
    ConstraintDescription: Must be empty or a 10-character API Gateway HTTP API ID.
    Description: Personal Tools HTTP API ID used to derive the same-account, same-region invoke ARN.

  CredentialProfileId:
    Type: String
    Default: github-repository-write
    AllowedPattern: '^[a-z0-9][a-z0-9-]{2,63}$'
    Description: Server-defined credential profile requested by the host provisioner.

  CredentialAgentArtifactS3Bucket:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: Must be empty or a valid S3 bucket name.
    Description: Bucket containing the versioned credential-agent zip.

  CredentialAgentArtifactS3Key:
    Type: String
    Default: ""
    AllowedPattern: '^$|^\S+$'
    ConstraintDescription: Must be empty or a non-whitespace S3 object key.
    Description: Key of the versioned credential-agent zip.

  CredentialAgentArtifactS3ObjectVersion:
    Type: String
    Default: ""
    AllowedPattern: '^$|^\S+$'
    Description: Optional immutable S3 version ID for the credential-agent zip.

  CredentialAgentArtifactSHA256:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[0-9a-f]{64}$'
    ConstraintDescription: Must be empty or a lowercase SHA-256 digest.
    Description: Required digest of the credential-agent zip.

  CodingContainerBaseImage:
    Type: String
    Default: docker.io/nikolaik/python-nodejs:python3.11-nodejs20
    AllowedPattern: '^[A-Za-z0-9./:_@-]+$'
    Description: Base image used to build the local Hermes coding image with the credential helper.

  HermesStateBackupBucket:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Must be empty or a valid S3 bucket name.
    Description: Optional bucket containing a state-only Hermes restore archive.

  HermesStateBackupKey:
    Type: String
    Default: ""
    AllowedPattern: '^$|^\S+$'
    ConstraintDescription: Must be empty or a non-whitespace S3 object key.
    Description: Optional .tar.gz object containing only memories/, sessions/, and workspace/ beneath the Hermes home.

Conditions:
  HasTelegramRuntimeSecret: !Not [!Equals [!Ref TelegramRuntimeSecretArn, ""]]
  HasPersonalToolsClientTokenSecret: !Not [!Equals [!Ref PersonalToolsClientTokenSecretArn, ""]]
  GitCodingIsEnabled: !Equals [!Ref GitCodingEnabled, "true"]
  HasStateBackupBucket: !Not [!Equals [!Ref HermesStateBackupBucket, ""]]
  HasStateBackupKey: !Not [!Equals [!Ref HermesStateBackupKey, ""]]
  HasStateBackup: !And
    - !Condition HasStateBackupBucket
    - !Condition HasStateBackupKey

Rules:
  TelegramRequiresRuntimeSecret:
    RuleCondition: !Equals [!Ref TelegramEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref TelegramRuntimeSecretArn, ""]]
        AssertDescription: TelegramRuntimeSecretArn is required when TelegramEnabled is true.

  StateRestoreParametersMustBePaired:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref HermesStateBackupBucket, ""]
            - !Equals [!Ref HermesStateBackupKey, ""]
          - !And
            - !Not [!Equals [!Ref HermesStateBackupBucket, ""]]
            - !Not [!Equals [!Ref HermesStateBackupKey, ""]]
        AssertDescription: HermesStateBackupBucket and HermesStateBackupKey must either both be empty or both be provided.

  GitCodingRequiresCredentialLease:
    RuleCondition: !Equals [!Ref GitCodingEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref CredentialLeaseApiId, ""]]
        AssertDescription: CredentialLeaseApiId is required when GitCodingEnabled is true.
      - Assert: !Not [!Equals [!Ref CredentialAgentArtifactS3Bucket, ""]]
        AssertDescription: CredentialAgentArtifactS3Bucket is required when GitCodingEnabled is true.
      - Assert: !Not [!Equals [!Ref CredentialAgentArtifactS3Key, ""]]
        AssertDescription: CredentialAgentArtifactS3Key is required when GitCodingEnabled is true.
      - Assert: !Not [!Equals [!Ref CredentialAgentArtifactSHA256, ""]]
        AssertDescription: CredentialAgentArtifactSHA256 is required when GitCodingEnabled is true.

Resources:
  HermesSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access; outbound web access for SSM, packages, and Bedrock.
      VpcId: !Ref VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - Description: HTTPS for SSM, Hermes install, and Bedrock
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTP for Ubuntu package mirrors
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: Project
          Value: !Ref ProjectTag

  HermesInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: HermesBootstrapSignal
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SignalOnlyThisStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStackResource
                  - cloudformation:SignalResource
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
              - Sid: ReadOnlyTelegramDesiredState
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/runtime/telegram-enabled
        - !If
          - HasTelegramRuntimeSecret
          - PolicyName: ReadTelegramRuntimeSecret
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadOnlyConfiguredTelegramSecret
                  Effect: Allow
                  Action:
                    - secretsmanager:DescribeSecret
                    - secretsmanager:GetSecretValue
                  Resource: !Ref TelegramRuntimeSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasPersonalToolsClientTokenSecret
          - PolicyName: ReadPersonalToolsClientToken
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadOnlyConfiguredPersonalToolsToken
                  Effect: Allow
                  Action:
                    - secretsmanager:DescribeSecret
                    - secretsmanager:GetSecretValue
                  Resource: !Ref PersonalToolsClientTokenSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasStateBackup
          - PolicyName: ReadHermesStateBackup
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadOnlyConfiguredStateArchive
                  Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:${AWS::Partition}:s3:::${HermesStateBackupBucket}/${HermesStateBackupKey}
          - !Ref AWS::NoValue
        - !If
          - GitCodingIsEnabled
          - PolicyName: UseCredentialLease
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: InvokeOnlyCredentialLeaseRoute
                  Effect: Allow
                  Action: execute-api:Invoke
                  Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CredentialLeaseApiId}/*/POST/v1/credential-leases
                - Sid: ReadOnlyCredentialAgentArtifact
                  Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                  Resource: !Sub arn:${AWS::Partition}:s3:::${CredentialAgentArtifactS3Bucket}/${CredentialAgentArtifactS3Key}
          - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectTag

  HermesInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref HermesInstanceRole

  TelegramDesiredStateParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/runtime/telegram-enabled
      Type: String
      Value: !Ref TelegramEnabled
      Description: Desired Telegram state. Gateway applies it from ExecStartPre without changing EC2 User Data.
      Tags:
        Project: !Ref ProjectTag
        Component: hermes-runtime-config

  HermesInstance:
    Type: AWS::EC2::Instance
    Metadata:
      RuntimeConfigScript:
        Fn::Sub: |
          #!/bin/bash
          set -euo pipefail

          AWS_REGION='${AWS::Region}'
          AWS_CLI=/usr/local/bin/aws
          HERMES_HOME=/home/hermes/.hermes
          HERMES_BIN=/home/hermes/.local/bin/hermes
          HERMES_PYTHON=/home/hermes/.hermes/hermes-agent/venv/bin/python
          MCP_SECRET_ARN='${PersonalToolsClientTokenSecretArn}'
          MCP_URL='${PersonalToolsMCPURL}'
          TELEGRAM_SECRET_ARN='${TelegramRuntimeSecretArn}'
          TELEGRAM_STATE_PARAMETER='${TelegramDesiredStateParameter}'
          OPENAI_CODEX_MODEL='${OpenAICodexModel}'
          GIT_CODING_ENABLED='${GitCodingEnabled}'
          CREDENTIAL_LEASE_URL='https://${CredentialLeaseApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/credential-leases'
          CREDENTIAL_PROFILE_ID='${CredentialProfileId}'
          CREDENTIAL_ARTIFACT_BUCKET='${CredentialAgentArtifactS3Bucket}'
          CREDENTIAL_ARTIFACT_KEY='${CredentialAgentArtifactS3Key}'
          CREDENTIAL_ARTIFACT_VERSION='${CredentialAgentArtifactS3ObjectVersion}'
          CREDENTIAL_ARTIFACT_SHA256='${CredentialAgentArtifactSHA256}'
          CODING_BASE_IMAGE='${CodingContainerBaseImage}'

          cd "$HERMES_HOME/hermes-agent"
          MANAGED_PATCH_ARCHIVE="$(mktemp)"
          "$AWS_CLI" cloudformation describe-stack-resource \
            --region "$AWS_REGION" \
            --stack-name '${AWS::StackName}' \
            --logical-resource-id HermesInstance \
            --query StackResourceDetail.Metadata \
            --output json \
            | jq -er 'fromjson.ManagedHermesPatchArchive' \
            | tr -d '\n' \
            | base64 -d >"$MANAGED_PATCH_ARCHIVE"
          "$HERMES_PYTHON" - "$MANAGED_PATCH_ARCHIVE" "$HERMES_HOME/managed-patches" <<'PY'
          import os
          import shutil
          import sys
          import tarfile
          import tempfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          target = Path(sys.argv[2])
          target.parent.mkdir(parents=True, exist_ok=True)
          staging = Path(tempfile.mkdtemp(prefix=".managed-patches-", dir=target.parent))
          backup = target.with_name(".managed-patches.previous")
          required = {
              "apply-hermes-patches.sh",
              "patches/hermes-v0.21.0-29112bef/commit.txt",
              "patches/hermes-v0.21.0-29112bef/P-002-browser-private-url.patch",
              "patches/hermes-v0.21.0-29112bef/P-003-podman-reuse.patch",
              "patches/hermes-v0.21.0-29112bef/P-005-egress-allowlist-only.patch",
              "patches/hermes-v0.21.0-29112bef/PATCHED_SHA256SUMS",
          }
          try:
              with tarfile.open(archive, "r:gz") as source:
                  members = source.getmembers()
                  actual = set()
                  for member in members:
                      name = PurePosixPath(member.name)
                      if (
                          name.is_absolute()
                          or ".." in name.parts
                          or member.issym()
                          or member.islnk()
                          or member.isdev()
                          or not member.isfile()
                          or not name.parts
                          or name.parts[0] != "managed-patches"
                      ):
                          raise SystemExit(f"unsafe managed patch archive member: {member.name}")
                      actual.add(str(PurePosixPath(*name.parts[1:])))
                  if actual != required:
                      raise SystemExit("managed patch archive is incomplete or contains unexpected files")
                  source.extractall(staging, members=members, filter="data")
              candidate = staging / "managed-patches"
              if backup.exists():
                  shutil.rmtree(backup)
              if target.exists():
                  os.replace(target, backup)
              os.replace(candidate, target)
              if backup.exists():
                  shutil.rmtree(backup)
          finally:
              shutil.rmtree(staging, ignore_errors=True)
          PY
          rm -f "$MANAGED_PATCH_ARCHIVE"
          env \
            HERMES_REPO="$HERMES_HOME/hermes-agent" \
            HERMES_PATCH_SET="$HERMES_HOME/managed-patches/patches/hermes-v0.21.0-29112bef" \
            HERMES_PYTHON="$HERMES_PYTHON" \
            "$HERMES_HOME/managed-patches/apply-hermes-patches.sh" apply

          if [ "$GIT_CODING_ENABLED" = true ]; then
            CREDENTIAL_RUNTIME="$HERMES_HOME/runtime/credential-agent"
            install -d -m 0700 "$HERMES_HOME/runtime" "$CREDENTIAL_RUNTIME"
            CREDENTIAL_ARCHIVE="$(mktemp)"
            if [ -n "$CREDENTIAL_ARTIFACT_VERSION" ]; then
              "$AWS_CLI" s3api get-object \
                --bucket "$CREDENTIAL_ARTIFACT_BUCKET" \
                --key "$CREDENTIAL_ARTIFACT_KEY" \
                --version-id "$CREDENTIAL_ARTIFACT_VERSION" \
                --region "$AWS_REGION" \
                "$CREDENTIAL_ARCHIVE" >/dev/null
            else
              "$AWS_CLI" s3api get-object \
                --bucket "$CREDENTIAL_ARTIFACT_BUCKET" \
                --key "$CREDENTIAL_ARTIFACT_KEY" \
                --region "$AWS_REGION" \
                "$CREDENTIAL_ARCHIVE" >/dev/null
            fi
            printf '%s  %s\n' "$CREDENTIAL_ARTIFACT_SHA256" "$CREDENTIAL_ARCHIVE" | sha256sum -c -
            rm -rf "$CREDENTIAL_RUNTIME/staging"
            install -d -m 0700 "$CREDENTIAL_RUNTIME/staging"
            unzip -q "$CREDENTIAL_ARCHIVE" -d "$CREDENTIAL_RUNTIME/staging"
            rm -f "$CREDENTIAL_ARCHIVE"
            test -f "$CREDENTIAL_RUNTIME/staging/hermes-credential-provisioner"
            test -f "$CREDENTIAL_RUNTIME/staging/git-credential-hermes"
            HERMES_BIN_DIR="$(dirname "$HERMES_BIN")"
            install -d -m 0755 "$HERMES_BIN_DIR"
            install -m 0755 "$CREDENTIAL_RUNTIME/staging/hermes-credential-provisioner" \
              "$HERMES_BIN_DIR/hermes-credential-provisioner"

            CREDENTIAL_IMAGE=localhost/hermes-coding:managed
            CURRENT_IMAGE_DIGEST="$(HERMES_DOCKER_BINARY=/usr/bin/podman podman image inspect \
              --format '{{ index .Labels "org.hermes.credential-agent.sha256" }}' \
              "$CREDENTIAL_IMAGE" 2>/dev/null || true)"
            if [ "$CURRENT_IMAGE_DIGEST" != "$CREDENTIAL_ARTIFACT_SHA256" ]; then
              install -m 0755 "$CREDENTIAL_RUNTIME/staging/git-credential-hermes" \
                "$CREDENTIAL_RUNTIME/git-credential-hermes"
              cat >"$CREDENTIAL_RUNTIME/Containerfile" <<CONTAINERFILE
          FROM $CODING_BASE_IMAGE
          COPY git-credential-hermes /usr/local/bin/git-credential-hermes
          RUN chmod 0755 /usr/local/bin/git-credential-hermes \\
              && git config --system credential.helper hermes \\
              && git config --system credential.useHttpPath true \\
              && git config --system credential.interactive false
          ENV HERMES_CREDENTIAL_DIR=/run/hermes/credentials
          ENV GIT_TERMINAL_PROMPT=0
          LABEL org.hermes.credential-agent.sha256=$CREDENTIAL_ARTIFACT_SHA256
          CONTAINERFILE
              HERMES_DOCKER_BINARY=/usr/bin/podman podman build \
                --pull=always \
                --tag "$CREDENTIAL_IMAGE" \
                "$CREDENTIAL_RUNTIME"
            fi
            rm -rf "$CREDENTIAL_RUNTIME/staging"

            HERMES_UID="$(id -u)"
            USER_UNIT_DIR="$HOME/.config/systemd/user"
            install -d -m 0700 "$USER_UNIT_DIR/default.target.wants"
            cat >"$USER_UNIT_DIR/hermes-credential-provisioner.service" <<EOF
          [Unit]
          Description=Hermes short-lived credential provisioner
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          Environment=HOME=$HOME
          ExecStart=$HERMES_BIN_DIR/hermes-credential-provisioner --endpoint $CREDENTIAL_LEASE_URL --region $AWS_REGION --profile $CREDENTIAL_PROFILE_ID --output %t/hermes-credentials/$CREDENTIAL_PROFILE_ID.json --refresh-before 10m
          Restart=always
          RestartSec=10
          RuntimeDirectory=hermes-credentials
          RuntimeDirectoryMode=0700
          UMask=0077
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=read-only
          ReadWritePaths=%t/hermes-credentials
          RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
          LockPersonality=true

          [Install]
          WantedBy=default.target
          EOF
            chmod 0600 "$USER_UNIT_DIR/hermes-credential-provisioner.service"
            ln -sfn ../hermes-credential-provisioner.service \
              "$USER_UNIT_DIR/default.target.wants/hermes-credential-provisioner.service"

            env \
              CREDENTIAL_MOUNT="/run/user/$HERMES_UID/hermes-credentials:/run/hermes/credentials:ro" \
              CREDENTIAL_IMAGE="$CREDENTIAL_IMAGE" \
              "$HERMES_PYTHON" -c '
          import os
          import yaml
          from utils import atomic_yaml_write

          path = "/home/hermes/.hermes/config.yaml"
          with open(path, encoding="utf-8") as source:
              config = yaml.safe_load(source) or {}

          terminal = config.setdefault("terminal", {})
          terminal["backend"] = "docker"
          terminal["docker_image"] = os.environ["CREDENTIAL_IMAGE"]
          terminal["docker_network"] = True
          terminal["docker_forward_env"] = []
          terminal["docker_extra_args"] = []
          volumes = [
              item for item in terminal.get("docker_volumes", [])
              if not str(item).split(":", 1)[-1].startswith("/run/hermes/credentials")
          ]
          volumes.append(os.environ["CREDENTIAL_MOUNT"])
          terminal["docker_volumes"] = volumes

          proxy = config.setdefault("proxy", {})
          proxy.update({
              "enabled": True,
              "auto_install": True,
              "credential_source": "env",
              "enforce_on_docker": True,
              "allow_env_fallback": False,
              "upstream_deny_cidrs": None,
              "extra_allowed_hosts": [
                  "github.com",
                  "api.github.com",
                  "objects.githubusercontent.com",
                  "raw.githubusercontent.com",
                  "codeload.github.com",
                  "github-releases.githubusercontent.com",
                  "proxy.golang.org",
                  "sum.golang.org",
                  "storage.googleapis.com",
                  "registry.npmjs.org",
              ],
          })
          config.setdefault("checkpoints", {})["enabled"] = True
          config.setdefault("skills", {}).update({
              "guard_agent_created": True,
              "write_approval": True,
          })
          config.setdefault("memory", {})["write_approval"] = True
          approvals = config.setdefault("approvals", {})
          approvals["mode"] = "smart"
          approvals["denial_breaker_threshold"] = 3
          deny = list(approvals.get("deny", []))
          for pattern in ("git push --force*", "git push *--force*"):
              if pattern not in deny:
                  deny.append(pattern)
          approvals["deny"] = deny
          git_policy = (
              "APPROVE ordinary git commit and non-force git push commands when the "
              "current branch starts with hermes/. ESCALATE attempts to update main, "
              "other branch namespaces, tags, remotes, credentials, or live host "
              "configuration outside the coding worktree."
          )
          current_policy = str(approvals.get("smart_policy", "")).strip()
          if git_policy not in current_policy:
              approvals["smart_policy"] = "\n\n".join(filter(None, (current_policy, git_policy)))
          atomic_yaml_write(path, config)
          '
            "$HERMES_BIN" egress install
            "$HERMES_BIN" egress setup --allowlist-only --no-bitwarden --no-restart
            "$HERMES_BIN" egress restart
          fi

          if [ ! -f "$HERMES_HOME/.env" ]; then
            install -m 0600 /dev/null "$HERMES_HOME/.env"
          fi

          if [ -n "$MCP_SECRET_ARN" ]; then
            MCP_PERSONAL_TOOLS_API_KEY="$("$AWS_CLI" secretsmanager get-secret-value \
              --secret-id "$MCP_SECRET_ARN" \
              --region "$AWS_REGION" \
              --query SecretString \
              --output text)"
            test -n "$MCP_PERSONAL_TOOLS_API_KEY"
            case "$MCP_PERSONAL_TOOLS_API_KEY" in
              *[!A-Za-z0-9_-]*) echo "Personal Tools client token contains unsupported dotenv characters" >&2; exit 1 ;;
            esac
            sed -i '/^MCP_PERSONAL_TOOLS_API_KEY=/d' "$HERMES_HOME/.env"
            printf 'MCP_PERSONAL_TOOLS_API_KEY=%s\n' "$MCP_PERSONAL_TOOLS_API_KEY" >>"$HERMES_HOME/.env"
            unset MCP_PERSONAL_TOOLS_API_KEY
            env MCP_URL="$MCP_URL" "$HERMES_PYTHON" -c '
          import os
          import yaml
          from utils import atomic_yaml_write

          path = "/home/hermes/.hermes/config.yaml"
          with open(path, encoding="utf-8") as source:
              config = yaml.safe_load(source) or {}
          config.setdefault("mcp_servers", {})["personal_tools"] = {
              "url": os.environ["MCP_URL"],
              "connect_timeout": 15,
              "headers": {
                  "X-Hermes-Gateway-Token": "Bearer ${!MCP_PERSONAL_TOOLS_API_KEY}",
              },
          }
          atomic_yaml_write(path, config)
          '
          fi

          TELEGRAM_ENABLED="$("$AWS_CLI" ssm get-parameter \
            --name "$TELEGRAM_STATE_PARAMETER" \
            --region "$AWS_REGION" \
            --query Parameter.Value \
            --output text)"
          case "$TELEGRAM_ENABLED" in
            true|false) ;;
            *) echo "Invalid Telegram desired state" >&2; exit 1 ;;
          esac
          "$HERMES_BIN" config set platforms.telegram.enabled "$TELEGRAM_ENABLED"
          sed -i \
            -e '/^TELEGRAM_BOT_TOKEN=/d' \
            -e '/^TELEGRAM_ALLOWED_USERS=/d' \
            -e '/^TELEGRAM_HOME_CHANNEL=/d' \
            -e '/^TELEGRAM_HOME_CHANNEL_THREAD_ID=/d' \
            "$HERMES_HOME/.env"

          if [ "$TELEGRAM_ENABLED" = true ]; then
            test -n "$TELEGRAM_SECRET_ARN"
            TELEGRAM_SECRET_JSON="$("$AWS_CLI" secretsmanager get-secret-value \
              --secret-id "$TELEGRAM_SECRET_ARN" \
              --region "$AWS_REGION" \
              --query SecretString \
              --output text)"
            TELEGRAM_BOT_TOKEN="$(printf '%s' "$TELEGRAM_SECRET_JSON" | jq -er '.TELEGRAM_BOT_TOKEN | select(type == "string" and length > 0)')"
            TELEGRAM_ALLOWED_USERS="$(printf '%s' "$TELEGRAM_SECRET_JSON" | jq -er '.TELEGRAM_ALLOWED_USERS | select(type == "string" and length > 0)')"
            TELEGRAM_HOME_CHANNEL="$(printf '%s' "$TELEGRAM_SECRET_JSON" | jq -er '.TELEGRAM_HOME_CHANNEL | select(type == "string" and length > 0)')"
            TELEGRAM_HOME_CHANNEL_THREAD_ID="$(printf '%s' "$TELEGRAM_SECRET_JSON" | jq -er '.TELEGRAM_HOME_CHANNEL_THREAD_ID // "" | select(type == "string")')"
            case "$TELEGRAM_BOT_TOKEN" in *[!A-Za-z0-9:_-]*) echo "Invalid Telegram token format" >&2; exit 1 ;; esac
            case "$TELEGRAM_ALLOWED_USERS" in *[!0-9,-]*) echo "Invalid Telegram allowed-users format" >&2; exit 1 ;; esac
            case "$TELEGRAM_HOME_CHANNEL" in *[!0-9-]*) echo "Invalid Telegram home-channel format" >&2; exit 1 ;; esac
            case "$TELEGRAM_HOME_CHANNEL_THREAD_ID" in *[!0-9]*) echo "Invalid Telegram thread-id format" >&2; exit 1 ;; esac
            {
              printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
              printf 'TELEGRAM_ALLOWED_USERS=%s\n' "$TELEGRAM_ALLOWED_USERS"
              printf 'TELEGRAM_HOME_CHANNEL=%s\n' "$TELEGRAM_HOME_CHANNEL"
              if [ -n "$TELEGRAM_HOME_CHANNEL_THREAD_ID" ]; then
                printf 'TELEGRAM_HOME_CHANNEL_THREAD_ID=%s\n' "$TELEGRAM_HOME_CHANNEL_THREAD_ID"
              fi
            } >>"$HERMES_HOME/.env"
            unset TELEGRAM_SECRET_JSON TELEGRAM_BOT_TOKEN TELEGRAM_ALLOWED_USERS TELEGRAM_HOME_CHANNEL TELEGRAM_HOME_CHANNEL_THREAD_ID
          fi

          chmod 0600 "$HERMES_HOME/.env"

          sed -i \
            -e '/^OPENAI_API_KEY=/d' \
            -e '/^OPENAI_BASE_URL=/d' \
            "$HERMES_HOME/.env"
          env OPENAI_CODEX_MODEL="$OPENAI_CODEX_MODEL" "$HERMES_PYTHON" -c '
          import os
          import yaml
          from utils import atomic_yaml_write

          path = "/home/hermes/.hermes/config.yaml"
          with open(path, encoding="utf-8") as source:
              config = yaml.safe_load(source) or {}

          model = config.setdefault("model", {})
          if not isinstance(model, dict):
              model = {}
              config["model"] = model
          model.update({
              "provider": "openai-codex",
              "default": os.environ["OPENAI_CODEX_MODEL"],
              "base_url": "https://chatgpt.com/backend-api/codex",
          })
          model.pop("api_key", None)
          model.pop("api_key_env", None)

          auxiliary = config.setdefault("auxiliary", {})
          if isinstance(auxiliary, dict):
              for task in auxiliary.values():
                  if not isinstance(task, dict):
                      continue
                  task["provider"] = "main"
                  for key in ("model", "base_url", "api_key", "api_key_env", "fallback_chain"):
                      task.pop(key, None)

          config.pop("fallback_providers", None)
          config.pop("fallback_model", None)
          config.pop("bedrock", None)
          config.setdefault("prompt_caching", {})["cache_ttl"] = "off"
          atomic_yaml_write(path, config)
          '
          if [ -f "$HERMES_HOME/auth.json" ]; then
            chmod 0600 "$HERMES_HOME/auth.json"
          fi

          TOKEN_OBSERVER_ARCHIVE="$(mktemp)"
          trap 'rm -f "$TOKEN_OBSERVER_ARCHIVE"' EXIT
          "$AWS_CLI" cloudformation describe-stack-resource \
            --region "$AWS_REGION" \
            --stack-name '${AWS::StackName}' \
            --logical-resource-id HermesInstance \
            --query StackResourceDetail.Metadata \
            --output json \
            | jq -er 'fromjson.TokenObserverArchive' \
            | tr -d '\n' \
            | base64 -d >"$TOKEN_OBSERVER_ARCHIVE"
          "$HERMES_PYTHON" - "$TOKEN_OBSERVER_ARCHIVE" "$HERMES_HOME/plugins/observability/token_observer" <<'PY'
          import os
          import shutil
          import sys
          import tarfile
          import tempfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          target = Path(sys.argv[2])
          target.parent.mkdir(parents=True, exist_ok=True)
          staging = Path(tempfile.mkdtemp(prefix=".token-observer-", dir=target.parent))
          backup = target.with_name(".token_observer.previous")
          try:
              with tarfile.open(archive, "r:gz") as source:
                  members = source.getmembers()
                  for member in members:
                      name = PurePosixPath(member.name)
                      if name.is_absolute() or ".." in name.parts or member.issym() or member.islnk() or member.isdev():
                          raise SystemExit(f"unsafe token observer archive member: {member.name}")
                  source.extractall(staging, members=members, filter="data")
              candidate = staging / "token_observer"
              required = {
                  "plugin.yaml", "__init__.py", "observer.py", "runtime_instrumentation.py", "report.py", "viewer.py",
                  "hermes-token-observer-viewer.service", "web",
              }
              if not candidate.is_dir() or not required.issubset({item.name for item in candidate.iterdir()}):
                  raise SystemExit("token observer archive is incomplete")
              if backup.exists():
                  shutil.rmtree(backup)
              if target.exists():
                  os.replace(target, backup)
              os.replace(candidate, target)
              if backup.exists():
                  shutil.rmtree(backup)
          finally:
              shutil.rmtree(staging, ignore_errors=True)
          PY
          chmod 0755 \
            "$HERMES_HOME/plugins/observability/token_observer/report.py" \
            "$HERMES_HOME/plugins/observability/token_observer/viewer.py"
          VIEWER_UNIT_DIR=/home/hermes/.config/systemd/user
          install -d -m 0700 "$VIEWER_UNIT_DIR" "$VIEWER_UNIT_DIR/default.target.wants"
          install -m 0600 \
            "$HERMES_HOME/plugins/observability/token_observer/hermes-token-observer-viewer.service" \
            "$VIEWER_UNIT_DIR/hermes-token-observer-viewer.service"
          ln -sfn ../hermes-token-observer-viewer.service \
            "$VIEWER_UNIT_DIR/default.target.wants/hermes-token-observer-viewer.service"
          if [ -n "${!XDG_RUNTIME_DIR:-}" ] && [ -S "${!XDG_RUNTIME_DIR}/bus" ]; then
            systemctl --user daemon-reload
            systemctl --user restart hermes-token-observer-viewer.service
          fi
          "$HERMES_BIN" plugins enable observability/token_observer --no-allow-tool-override
          "$HERMES_BIN" config set browser.backend off
          "$HERMES_BIN" config check
