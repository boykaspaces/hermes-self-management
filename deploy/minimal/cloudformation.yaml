AWSTemplateFormatVersion: "2010-09-09"
Description: Minimal Hermes Agent host on EC2 with SSM and ChatGPT subscription-backed OpenAI Codex access.

Parameters:
  ProjectTag:
    Type: String
    Default: hermes-self-management
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9_.:/+=@-]{1,126}$'
    Description: Neutral project tag applied to created resources.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that contains the selected subnet.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with outbound internet access. Pin this explicitly so rebuilds do not depend on the default subnet.

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
    Description: t3.small supports the current low-concurrency headless browser workload; use t3.medium for concurrent browser sessions.

  RootVolumeSize:
    Type: Number
    Default: 20
    MinValue: 12
    MaxValue: 100
    Description: Encrypted gp3 root volume size in GiB.

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Explicitly selected and reviewed Ubuntu 24.04 LTS x86_64 AMI for the target Region.

  HermesGitRef:
    Type: String
    Default: 29112bef099274229cadff79cdff7bf7b99c4b77
    AllowedPattern: "^[0-9a-f]{40}$"
    ConstraintDescription: Must be a full 40-character Git commit SHA.
    Description: Exact Hermes Agent source revision verified in production.

  AWSCLIVersion:
    Type: String
    Default: 2.36.23
    AllowedPattern: "^2\\.[0-9]+\\.[0-9]+$"
    ConstraintDescription: Must be an AWS CLI v2 semantic version such as 2.36.23.
    Description: Exact AWS CLI v2 version used for Secrets Manager, SSM Parameter, S3 restore, and CloudFormation signaling.

  RuntimeBundleArtifactS3Bucket:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: Must be a valid S3 bucket name.
    Description: Bucket containing the immutable Hermes runtime bundle.

  RuntimeBundleArtifactS3Key:
    Type: String
    AllowedPattern: '^\S+$'
    ConstraintDescription: Must be a non-whitespace S3 object key.
    Description: Content-addressed key of the immutable Hermes runtime bundle.

  RuntimeBundleArtifactS3ObjectVersion:
    Type: String
    Default: ""
    AllowedPattern: '^$|^\S+$'
    Description: Optional immutable S3 version ID for the Hermes runtime bundle.

  RuntimeBundleArtifactSHA256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
    ConstraintDescription: Must be a lowercase SHA-256 digest.
    Description: Required digest of the immutable Hermes runtime bundle.

  RuntimeProfileParameterName:
    Type: String
    AllowedPattern: '^/[A-Za-z0-9_.\-/]+$'
    ConstraintDescription: Must be an absolute SSM Parameter Store name.
    Description: Existing SSM String parameter containing the validated, non-secret consumer runtime profile.

  TelegramRuntimeSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$"
    ConstraintDescription: Must be empty or a complete Secrets Manager secret ARN.
    Description: JSON secret containing TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS, TELEGRAM_HOME_CHANNEL, and optional TELEGRAM_HOME_CHANNEL_THREAD_ID.

  PersonalToolsClientTokenSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$"
    ConstraintDescription: Must be empty or a complete Secrets Manager secret ARN.
    Description: Existing Personal Tools client-token Secret. Its value is synchronized before Gateway start and never stored in this template.

  GitCodingEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the restricted-network coding container and short-lived GitHub credential lease client.

  CredentialLeaseApiId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9]{10}$'
    ConstraintDescription: Must be empty or a 10-character API Gateway HTTP API ID.
    Description: Personal Tools HTTP API ID used to derive the same-account, same-region invoke ARN.

  CredentialAgentArtifactS3Bucket:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: Must be empty or a valid S3 bucket name.
    Description: Bucket containing the versioned credential-agent zip.

  CredentialAgentArtifactS3Key:
    Type: String
    Default: ""
    AllowedPattern: '^$|^\S+$'
    ConstraintDescription: Must be empty or a non-whitespace S3 object key.
    Description: Key of the versioned credential-agent zip.

  CredentialAgentArtifactS3ObjectVersion:
    Type: String
    Default: ""
    AllowedPattern: '^$|^\S+$'
    Description: Optional immutable S3 version ID for the credential-agent zip.

  CredentialAgentArtifactSHA256:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[0-9a-f]{64}$'
    ConstraintDescription: Must be empty or a lowercase SHA-256 digest.
    Description: Required digest of the credential-agent zip.

  CodingContainerBaseImage:
    Type: String
    Default: docker.io/nikolaik/python-nodejs:python3.11-nodejs20
    AllowedPattern: '^[A-Za-z0-9./:_@-]+$'
    Description: Base image used to build the local Hermes coding image with the credential helper.

  HermesStateBackupBucket:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Must be empty or a valid S3 bucket name.
    Description: Optional bucket containing a state-only Hermes restore archive.

  HermesStateBackupKey:
    Type: String
    Default: ""
    AllowedPattern: '^$|^\S+$'
    ConstraintDescription: Must be empty or a non-whitespace S3 object key.
    Description: Optional .tar.gz object containing only memories/, sessions/, and workspace/ beneath the Hermes home.

Conditions:
  HasTelegramRuntimeSecret: !Not [!Equals [!Ref TelegramRuntimeSecretArn, ""]]
  HasPersonalToolsClientTokenSecret: !Not [!Equals [!Ref PersonalToolsClientTokenSecretArn, ""]]
  GitCodingIsEnabled: !Equals [!Ref GitCodingEnabled, "true"]
  HasStateBackupBucket: !Not [!Equals [!Ref HermesStateBackupBucket, ""]]
  HasStateBackupKey: !Not [!Equals [!Ref HermesStateBackupKey, ""]]
  HasStateBackup: !And
    - !Condition HasStateBackupBucket
    - !Condition HasStateBackupKey

Rules:
  StateRestoreParametersMustBePaired:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref HermesStateBackupBucket, ""]
            - !Equals [!Ref HermesStateBackupKey, ""]
          - !And
            - !Not [!Equals [!Ref HermesStateBackupBucket, ""]]
            - !Not [!Equals [!Ref HermesStateBackupKey, ""]]
        AssertDescription: HermesStateBackupBucket and HermesStateBackupKey must either both be empty or both be provided.

  GitCodingRequiresCredentialLease:
    RuleCondition: !Equals [!Ref GitCodingEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref CredentialLeaseApiId, ""]]
        AssertDescription: CredentialLeaseApiId is required when GitCodingEnabled is true.
      - Assert: !Not [!Equals [!Ref CredentialAgentArtifactS3Bucket, ""]]
        AssertDescription: CredentialAgentArtifactS3Bucket is required when GitCodingEnabled is true.
      - Assert: !Not [!Equals [!Ref CredentialAgentArtifactS3Key, ""]]
        AssertDescription: CredentialAgentArtifactS3Key is required when GitCodingEnabled is true.
      - Assert: !Not [!Equals [!Ref CredentialAgentArtifactSHA256, ""]]
        AssertDescription: CredentialAgentArtifactSHA256 is required when GitCodingEnabled is true.

Resources:
  HermesSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access; outbound web access for SSM, packages, and Bedrock.
      VpcId: !Ref VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - Description: HTTPS for SSM, Hermes install, and Bedrock
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTP for Ubuntu package mirrors
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: Project
          Value: !Ref ProjectTag

  HermesInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: HermesBootstrapSignal
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SignalOnlyThisStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStackResource
                  - cloudformation:SignalResource
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
        - PolicyName: ReadHermesRuntimeProfile
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOnlyConfiguredRuntimeProfile
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${RuntimeProfileParameterName}
        - PolicyName: ReadHermesRuntimeBundle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOnlyConfiguredRuntimeBundle
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${RuntimeBundleArtifactS3Bucket}/${RuntimeBundleArtifactS3Key}
        - !If
          - HasTelegramRuntimeSecret
          - PolicyName: ReadTelegramRuntimeSecret
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadOnlyConfiguredTelegramSecret
                  Effect: Allow
                  Action:
                    - secretsmanager:DescribeSecret
                    - secretsmanager:GetSecretValue
                  Resource: !Ref TelegramRuntimeSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasPersonalToolsClientTokenSecret
          - PolicyName: ReadPersonalToolsClientToken
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadOnlyConfiguredPersonalToolsToken
                  Effect: Allow
                  Action:
                    - secretsmanager:DescribeSecret
                    - secretsmanager:GetSecretValue
                  Resource: !Ref PersonalToolsClientTokenSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasStateBackup
          - PolicyName: ReadHermesStateBackup
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadOnlyConfiguredStateArchive
                  Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:${AWS::Partition}:s3:::${HermesStateBackupBucket}/${HermesStateBackupKey}
          - !Ref AWS::NoValue
        - !If
          - GitCodingIsEnabled
          - PolicyName: UseCredentialLease
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: InvokeOnlyCredentialLeaseRoute
                  Effect: Allow
                  Action: execute-api:Invoke
                  Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CredentialLeaseApiId}/*/POST/v1/credential-leases
                - Sid: ReadOnlyCredentialAgentArtifact
                  Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                  Resource: !Sub arn:${AWS::Partition}:s3:::${CredentialAgentArtifactS3Bucket}/${CredentialAgentArtifactS3Key}
          - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectTag

  HermesInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref HermesInstanceRole

  HermesInstance:
    Type: AWS::EC2::Instance
    Metadata:
      RuntimeConfigScript:
        Fn::Sub: |
          #!/bin/bash
          set -euo pipefail

          AWS_REGION='${AWS::Region}'
          AWS_CLI=/usr/local/bin/aws
          HERMES_HOME=/home/hermes/.hermes
          HERMES_BIN=/home/hermes/.local/bin/hermes
          HERMES_PYTHON=/home/hermes/.hermes/hermes-agent/venv/bin/python
          MCP_SECRET_ARN='${PersonalToolsClientTokenSecretArn}'
          TELEGRAM_SECRET_ARN='${TelegramRuntimeSecretArn}'
          RUNTIME_PROFILE_PARAMETER='${RuntimeProfileParameterName}'
          GIT_CODING_ENABLED='${GitCodingEnabled}'
          CREDENTIAL_LEASE_URL='https://${CredentialLeaseApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/credential-leases'
          CREDENTIAL_ARTIFACT_BUCKET='${CredentialAgentArtifactS3Bucket}'
          CREDENTIAL_ARTIFACT_KEY='${CredentialAgentArtifactS3Key}'
          CREDENTIAL_ARTIFACT_VERSION='${CredentialAgentArtifactS3ObjectVersion}'
          CREDENTIAL_ARTIFACT_SHA256='${CredentialAgentArtifactSHA256}'
          CODING_BASE_IMAGE='${CodingContainerBaseImage}'
          RUNTIME_BUNDLE_BUCKET='${RuntimeBundleArtifactS3Bucket}'
          RUNTIME_BUNDLE_KEY='${RuntimeBundleArtifactS3Key}'
          RUNTIME_BUNDLE_VERSION='${RuntimeBundleArtifactS3ObjectVersion}'
          RUNTIME_BUNDLE_SHA256='${RuntimeBundleArtifactSHA256}'
          RUNTIME_RELEASES_ROOT="$HERMES_HOME/runtime/releases"
          RUNTIME_RELEASE_DIR="$RUNTIME_RELEASES_ROOT/$RUNTIME_BUNDLE_SHA256"

          install -d -m 0700 "$HERMES_HOME/runtime" "$RUNTIME_RELEASES_ROOT"
          if [ ! -x "$RUNTIME_RELEASE_DIR/runtime-config.sh" ]; then
            RUNTIME_WORK_DIR="$(mktemp -d "$RUNTIME_RELEASES_ROOT/.runtime-bundle.XXXXXX")"
            trap 'rm -rf "$RUNTIME_WORK_DIR"' EXIT
            RUNTIME_ARCHIVE="$RUNTIME_WORK_DIR/runtime-bundle.tar.gz"
            if [ -n "$RUNTIME_BUNDLE_VERSION" ]; then
              "$AWS_CLI" s3api get-object \
                --bucket "$RUNTIME_BUNDLE_BUCKET" \
                --key "$RUNTIME_BUNDLE_KEY" \
                --version-id "$RUNTIME_BUNDLE_VERSION" \
                --region "$AWS_REGION" \
                "$RUNTIME_ARCHIVE" >/dev/null
            else
              "$AWS_CLI" s3api get-object \
                --bucket "$RUNTIME_BUNDLE_BUCKET" \
                --key "$RUNTIME_BUNDLE_KEY" \
                --region "$AWS_REGION" \
                "$RUNTIME_ARCHIVE" >/dev/null
            fi
            printf '%s  %s\n' "$RUNTIME_BUNDLE_SHA256" "$RUNTIME_ARCHIVE" | sha256sum -c -
            "$HERMES_PYTHON" - "$RUNTIME_ARCHIVE" "$RUNTIME_WORK_DIR/release" <<'PY'
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          target = Path(sys.argv[2])
          expected = {
              "runtime-config.sh",
              "apply_runtime_profile.py",
              "validate_runtime_profile.py",
              "managed-patches.tar.gz",
              "token-observer.tar.gz",
          }
          target.mkdir(mode=0o700)
          with tarfile.open(archive, "r:gz") as source:
              members = source.getmembers()
              actual = set()
              for member in members:
                  name = PurePosixPath(member.name)
                  if (
                      name.is_absolute()
                      or ".." in name.parts
                      or len(name.parts) != 1
                      or member.issym()
                      or member.islnk()
                      or member.isdev()
                      or not member.isfile()
                  ):
                      raise SystemExit(f"unsafe runtime bundle member: {member.name}")
                  actual.add(member.name)
              if actual != expected:
                  raise SystemExit("runtime bundle is incomplete or contains unexpected files")
              source.extractall(target, members=members, filter="data")
          PY
            chmod 0755 \
              "$RUNTIME_WORK_DIR/release/runtime-config.sh" \
              "$RUNTIME_WORK_DIR/release/apply_runtime_profile.py" \
              "$RUNTIME_WORK_DIR/release/validate_runtime_profile.py"
            if [ ! -e "$RUNTIME_RELEASE_DIR" ]; then
              mv "$RUNTIME_WORK_DIR/release" "$RUNTIME_RELEASE_DIR"
            fi
            trap - EXIT
            rm -rf "$RUNTIME_WORK_DIR"
          fi

          RUNTIME_PROFILE_ROOT="$HERMES_HOME/runtime/profile"
          RUNTIME_PROFILE_FILE="$RUNTIME_PROFILE_ROOT/current.json"
          install -d -m 0700 "$RUNTIME_PROFILE_ROOT"
          PROFILE_WORK_FILE="$(mktemp "$RUNTIME_PROFILE_ROOT/.runtime-profile.XXXXXX")"
          if "$AWS_CLI" ssm get-parameter \
            --name "$RUNTIME_PROFILE_PARAMETER" \
            --region "$AWS_REGION" \
            --query Parameter.Value \
            --output text >"$PROFILE_WORK_FILE"; then
            if ! "$HERMES_PYTHON" \
              "$RUNTIME_RELEASE_DIR/validate_runtime_profile.py" \
              "$PROFILE_WORK_FILE"; then
              rm -f "$PROFILE_WORK_FILE"
              exit 1
            fi
            chmod 0600 "$PROFILE_WORK_FILE"
            mv "$PROFILE_WORK_FILE" "$RUNTIME_PROFILE_FILE"
          else
            rm -f "$PROFILE_WORK_FILE"
            test -f "$RUNTIME_PROFILE_FILE"
            "$HERMES_PYTHON" \
              "$RUNTIME_RELEASE_DIR/validate_runtime_profile.py" \
              "$RUNTIME_PROFILE_FILE"
            echo "Using cached runtime profile after SSM read failure" >&2
          fi

          exec env \
            AWS_REGION="$AWS_REGION" \
            AWS_CLI="$AWS_CLI" \
            HERMES_HOME="$HERMES_HOME" \
            HERMES_BIN="$HERMES_BIN" \
            HERMES_PYTHON="$HERMES_PYTHON" \
            MCP_SECRET_ARN="$MCP_SECRET_ARN" \
            TELEGRAM_SECRET_ARN="$TELEGRAM_SECRET_ARN" \
            GIT_CODING_ENABLED="$GIT_CODING_ENABLED" \
            CREDENTIAL_LEASE_URL="$CREDENTIAL_LEASE_URL" \
            CREDENTIAL_ARTIFACT_BUCKET="$CREDENTIAL_ARTIFACT_BUCKET" \
            CREDENTIAL_ARTIFACT_KEY="$CREDENTIAL_ARTIFACT_KEY" \
            CREDENTIAL_ARTIFACT_VERSION="$CREDENTIAL_ARTIFACT_VERSION" \
            CREDENTIAL_ARTIFACT_SHA256="$CREDENTIAL_ARTIFACT_SHA256" \
            CODING_BASE_IMAGE="$CODING_BASE_IMAGE" \
            HERMES_RUNTIME_BUNDLE_DIR="$RUNTIME_RELEASE_DIR" \
            HERMES_RUNTIME_PROFILE_FILE="$RUNTIME_PROFILE_FILE" \
            "$RUNTIME_RELEASE_DIR/runtime-config.sh"
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT45M
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HermesInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !GetAtt HermesSecurityGroup.GroupId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: disabled
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          signal_stack() {
            /usr/local/bin/aws cloudformation signal-resource \
              --region '${AWS::Region}' \
              --stack-name '${AWS::StackName}' \
              --logical-resource-id HermesInstance \
              --unique-id "$(cat /var/lib/cloud/data/instance-id)" \
              --status "$1" || true
          }
          trap 'signal_stack FAILURE' ERR

          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            ffmpeg \
            fuse-overlayfs \
            git \
            jq \
            libffi-dev \
            podman \
            python3-dev \
            ripgrep \
            slirp4netns \
            uidmap \
            unzip \
            xz-utils

          aws_cli_tmp="$(mktemp -d)"
          curl -fsSLo "$aws_cli_tmp/awscliv2.zip" \
            'https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWSCLIVersion}.zip'
          unzip -q "$aws_cli_tmp/awscliv2.zip" -d "$aws_cli_tmp"
          "$aws_cli_tmp/aws/install" \
            --bin-dir /usr/local/bin \
            --install-dir /usr/local/aws-cli
          /usr/local/bin/aws --version | grep -F 'aws-cli/${AWSCLIVersion} '
          case "$aws_cli_tmp" in
            /tmp/tmp.*) rm -rf -- "$aws_cli_tmp" ;;
            *) echo "Unexpected AWS CLI temporary path" >&2; exit 1 ;;
          esac

          if ! id -u hermes >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash hermes
          fi

          loginctl enable-linger hermes

          systemctl disable --now \
            podman.socket \
            podman.service \
            podman-auto-update.timer \
            podman-restart.service \
            podman-clean-transient.service || true

          install -d -m 0700 -o hermes -g hermes /home/hermes/.hermes

          for installer_attempt in 1 2 3; do
            if sudo -u hermes -H env NODE_DEPS_TIMEOUT=1200 bash -lc \
              'curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-setup --skip-browser --skip-computer-use'; then
              break
            fi
            if [ "$installer_attempt" -eq 3 ]; then
              echo "Hermes installer failed after three attempts" >&2
              exit 1
            fi
            sleep 10
          done

          sudo -u hermes -H env HERMES_GIT_REF='${HermesGitRef}' bash -lc '
            cd /home/hermes/.hermes/hermes-agent
            if ! git cat-file -e "$HERMES_GIT_REF^{commit}" 2>/dev/null; then
              git fetch --quiet --depth 1 origin "$HERMES_GIT_REF"
            fi
            git checkout --quiet --detach "$HERMES_GIT_REF"
            test "$(git rev-parse HEAD)" = "$HERMES_GIT_REF"
            venv/bin/python -m ensurepip --upgrade
            venv/bin/python -m pip install -e ".[all]"
          '

          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            bash -lc \
              'cd /home/hermes/.hermes/hermes-agent; npm ci --silent --workspaces=false'
          env \
            HOME=/home/hermes \
            USER=hermes \
            LOGNAME=hermes \
            PATH=/home/hermes/.hermes/node/bin:/home/hermes/.hermes/node:/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            npx --ignore-scripts -y 'agent-browser@^0.26.0' install --with-deps
          chown -R hermes:hermes \
            /home/hermes/.agent-browser \
            /home/hermes/.hermes/hermes-agent/node_modules

          install -d -m 0755 -o hermes -g hermes /home/hermes/.cache/ms-playwright
          CHROME_DIR="$(find /home/hermes/.agent-browser/browsers -mindepth 1 -maxdepth 1 -type d -name 'chrome-*' | sort | tail -n 1)"
          test -n "$CHROME_DIR"
          ln -sfn "$CHROME_DIR" /home/hermes/.cache/ms-playwright/chromium-agent-browser
          chown -h hermes:hermes /home/hermes/.cache/ms-playwright/chromium-agent-browser

          sudo -u hermes -H env \
            PATH=/home/hermes/.hermes/bin:/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes tools post-setup agent_browser

          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes tools post-setup ddgs

          if [ -n '${HermesStateBackupBucket}' ]; then
            install -d -m 0700 -o hermes -g hermes /home/hermes/.restore
            /usr/local/bin/aws s3 cp \
              's3://${HermesStateBackupBucket}/${HermesStateBackupKey}' \
              /home/hermes/.restore/hermes-state.tar.gz \
              --region '${AWS::Region}' \
              --only-show-errors
            /home/hermes/.hermes/hermes-agent/venv/bin/python -c '
          import pathlib
          import tarfile

          archive = "/home/hermes/.restore/hermes-state.tar.gz"
          destination = "/home/hermes/.hermes"
          allowed_roots = {"memories", "sessions", "workspace"}
          with tarfile.open(archive, "r:gz") as source:
              for member in source.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not path.parts or path.parts[0] not in allowed_roots:
                      raise SystemExit(f"unsafe or unsupported state path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"links and device entries are not allowed: {member.name}")
              source.extractall(destination)
          '
            chown -R hermes:hermes \
              /home/hermes/.hermes/memories \
              /home/hermes/.hermes/sessions \
              /home/hermes/.hermes/workspace 2>/dev/null || true
            rm -f /home/hermes/.restore/hermes-state.tar.gz
          fi

          cat >/usr/local/sbin/hermes-sync-runtime-config <<'RUNTIME_WRAPPER_EOF'
          #!/bin/bash
          set -euo pipefail
          runtime_script="$(mktemp)"
          trap 'rm -f "$runtime_script"' EXIT
          /usr/local/bin/aws cloudformation describe-stack-resource \
            --region '${AWS::Region}' \
            --stack-name '${AWS::StackName}' \
            --logical-resource-id HermesInstance \
            --query StackResourceDetail.Metadata \
            --output json | jq -er 'fromjson.RuntimeConfigScript' >"$runtime_script"
          chmod 0700 "$runtime_script"
          "$runtime_script"
          RUNTIME_WRAPPER_EOF
          chmod 0755 /usr/local/sbin/hermes-sync-runtime-config
          chown root:root /usr/local/sbin/hermes-sync-runtime-config
          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /usr/local/sbin/hermes-sync-runtime-config

          sudo -u hermes -H env HERMES_DOCKER_BINARY=/usr/bin/podman \
            podman pull docker.io/nikolaik/python-nodejs:python3.11-nodejs20

          sudo -u hermes -H env \
            PATH=/home/hermes/.hermes/node:/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            bash -lc \
              'cd /home/hermes/.hermes/hermes-agent; npm ci --workspace web --silent --prefer-offline; npm run build --workspace web'

          HERMES_UID="$(id -u hermes)"
          systemctl start "user@$HERMES_UID.service"

          sudo -u hermes -H env \
            XDG_RUNTIME_DIR="/run/user/$HERMES_UID" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$HERMES_UID/bus" \
            HERMES_DOCKER_BINARY=/usr/bin/podman \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes gateway install \
              --force \
              --start-now \
              --start-on-login

          install -d -m 0755 -o hermes -g hermes \
            /home/hermes/.config/systemd/user/hermes-gateway.service.d
          cat >/home/hermes/.config/systemd/user/hermes-gateway.service.d/10-runtime-config.conf <<EOF
          [Unit]
          $([ '${GitCodingEnabled}' = true ] && printf '%s\n' 'Requires=hermes-credential-provisioner.service' 'After=hermes-credential-provisioner.service')

          [Service]
          ExecStartPre=/usr/local/sbin/hermes-sync-runtime-config
          EOF
          chown hermes:hermes \
            /home/hermes/.config/systemd/user/hermes-gateway.service.d/10-runtime-config.conf
          sudo -u hermes -H env \
            XDG_RUNTIME_DIR="/run/user/$HERMES_UID" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$HERMES_UID/bus" \
            systemctl --user daemon-reload
          sudo -u hermes -H env \
            XDG_RUNTIME_DIR="/run/user/$HERMES_UID" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$HERMES_UID/bus" \
            systemctl --user restart hermes-gateway.service

          cat >/etc/systemd/system/hermes-dashboard.service <<EOF
          [Unit]
          Description=Hermes Agent Dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=hermes
          Group=hermes
          WorkingDirectory=/home/hermes/.hermes
          Environment="HOME=/home/hermes"
          Environment="USER=hermes"
          Environment="LOGNAME=hermes"
          Environment="XDG_RUNTIME_DIR=/run/user/$HERMES_UID"
          Environment="DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$HERMES_UID/bus"
          Environment="HERMES_HOME=/home/hermes/.hermes"
          Environment="HERMES_DOCKER_BINARY=/usr/bin/podman"
          Environment="VIRTUAL_ENV=/home/hermes/.hermes/hermes-agent/venv"
          Environment="PATH=/home/hermes/.hermes/node:/home/hermes/.local/bin:/home/hermes/.hermes/hermes-agent/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          ExecStartPre=/usr/bin/test -f /home/hermes/.hermes/hermes-agent/hermes_cli/web_dist/index.html
          ExecStart=/home/hermes/.hermes/hermes-agent/venv/bin/python -m hermes_cli.main dashboard --host 127.0.0.1 --port 9119 --no-open --skip-build
          Restart=always
          RestartSec=5
          KillMode=mixed
          KillSignal=SIGTERM
          TimeoutStopSec=30
          StandardOutput=journal
          StandardError=journal
          UMask=0077

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now hermes-dashboard.service

          sudo -u hermes -H env \
            XDG_RUNTIME_DIR="/run/user/$HERMES_UID" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$HERMES_UID/bus" \
            systemctl --user is-active --quiet hermes-gateway.service
          systemctl is-active --quiet hermes-dashboard.service
          for health_attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9119/api/health >/dev/null; then
              break
            fi
            if [ "$health_attempt" -eq 60 ]; then
              echo "Dashboard health check did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:9120/healthz >/dev/null
          if [ -n '${PersonalToolsClientTokenSecretArn}' ]; then
            sudo -u hermes -H env \
              PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
              /home/hermes/.local/bin/hermes mcp test personal_tools
          fi

          touch /home/hermes/.bootstrap-complete
          chown hermes:hermes /home/hermes/.bootstrap-complete
          trap - ERR
          signal_stack SUCCESS
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Component
          Value: agent-runtime

Outputs:
  InstanceId:
    Description: EC2 instance to target with AWS Systems Manager Session Manager.
    Value: !Ref HermesInstance

  Region:
    Description: AWS Region where the stack was deployed.
    Value: !Ref AWS::Region

  ConnectCommand:
    Description: Run this command locally to open a shell without SSH.
    Value: !Sub aws ssm start-session --target ${HermesInstance} --region ${AWS::Region}

  InstanceRoleArn:
    Description: Runtime role ARN. Use this when another stack must grant the rebuilt Hermes host access.
    Value: !GetAtt HermesInstanceRole.Arn

  PinnedAmiId:
    Description: Exact AMI used for this rebuild.
    Value: !Ref AmiId

  PinnedHermesGitRef:
    Description: Exact Hermes source revision used for this rebuild.
    Value: !Ref HermesGitRef

  RuntimeProfileParameter:
    Description: Consumer-owned SSM parameter read before each Gateway start.
    Value: !Ref RuntimeProfileParameterName
