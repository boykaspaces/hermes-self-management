      # TOKEN_OBSERVER_ARCHIVE_END
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT45M
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HermesInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !GetAtt HermesSecurityGroup.GroupId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: disabled
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          signal_stack() {
            /usr/local/bin/aws cloudformation signal-resource \
              --region '${AWS::Region}' \
              --stack-name '${AWS::StackName}' \
              --logical-resource-id HermesInstance \
              --unique-id "$(cat /var/lib/cloud/data/instance-id)" \
              --status "$1" || true
          }
          trap 'signal_stack FAILURE' ERR

          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            ffmpeg \
            fuse-overlayfs \
            git \
            jq \
            libffi-dev \
            podman \
            python3-dev \
            ripgrep \
            slirp4netns \
            uidmap \
            unzip \
            xz-utils

          aws_cli_tmp="$(mktemp -d)"
          curl -fsSLo "$aws_cli_tmp/awscliv2.zip" \
            'https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWSCLIVersion}.zip'
          unzip -q "$aws_cli_tmp/awscliv2.zip" -d "$aws_cli_tmp"
          "$aws_cli_tmp/aws/install" \
            --bin-dir /usr/local/bin \
            --install-dir /usr/local/aws-cli
          /usr/local/bin/aws --version | grep -F 'aws-cli/${AWSCLIVersion} '
          case "$aws_cli_tmp" in
            /tmp/tmp.*) rm -rf -- "$aws_cli_tmp" ;;
            *) echo "Unexpected AWS CLI temporary path" >&2; exit 1 ;;
          esac

          if ! id -u hermes >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash hermes
          fi

          loginctl enable-linger hermes

          systemctl disable --now \
            podman.socket \
            podman.service \
            podman-auto-update.timer \
            podman-restart.service \
            podman-clean-transient.service || true

          install -d -m 0700 -o hermes -g hermes /home/hermes/.hermes

          for installer_attempt in 1 2 3; do
            if sudo -u hermes -H env NODE_DEPS_TIMEOUT=1200 bash -lc \
              'curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-setup --skip-browser --skip-computer-use'; then
              break
            fi
            if [ "$installer_attempt" -eq 3 ]; then
              echo "Hermes installer failed after three attempts" >&2
              exit 1
            fi
            sleep 10
          done

          sudo -u hermes -H env HERMES_GIT_REF='${HermesGitRef}' bash -lc '
            cd /home/hermes/.hermes/hermes-agent
            if ! git cat-file -e "$HERMES_GIT_REF^{commit}" 2>/dev/null; then
              git fetch --quiet --depth 1 origin "$HERMES_GIT_REF"
            fi
            git checkout --quiet --detach "$HERMES_GIT_REF"
            test "$(git rev-parse HEAD)" = "$HERMES_GIT_REF"
            venv/bin/python -m ensurepip --upgrade
            venv/bin/python -m pip install -e ".[all]"
          '

          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            bash -lc \
              'cd /home/hermes/.hermes/hermes-agent; npm ci --silent --workspaces=false'
          env \
            HOME=/home/hermes \
            USER=hermes \
            LOGNAME=hermes \
            PATH=/home/hermes/.hermes/node/bin:/home/hermes/.hermes/node:/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            npx --ignore-scripts -y 'agent-browser@^0.26.0' install --with-deps
          chown -R hermes:hermes \
            /home/hermes/.agent-browser \
            /home/hermes/.hermes/hermes-agent/node_modules

          install -d -m 0755 -o hermes -g hermes /home/hermes/.cache/ms-playwright
          CHROME_DIR="$(find /home/hermes/.agent-browser/browsers -mindepth 1 -maxdepth 1 -type d -name 'chrome-*' | sort | tail -n 1)"
          test -n "$CHROME_DIR"
          ln -sfn "$CHROME_DIR" /home/hermes/.cache/ms-playwright/chromium-agent-browser
          chown -h hermes:hermes /home/hermes/.cache/ms-playwright/chromium-agent-browser

          sudo -u hermes -H env \
            PATH=/home/hermes/.hermes/bin:/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes tools post-setup agent_browser

          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes tools post-setup ddgs
          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes config set web.search_backend ddgs
          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes config set browser.cloud_provider local
          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes config set browser.backend off
          sudo -u hermes -H bash -lc \
            'export PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin; hermes config set browser.inactivity_timeout 60; hermes config set browser.command_timeout 30; hermes config set browser.record_sessions false; hermes config set browser.headed false; hermes config set browser.allow_private_urls false; hermes config set browser.auto_local_for_private_urls false; hermes config set browser.allow_unsafe_evaluate false; hermes config set browser.restrict_evaluate true; hermes config set browser.dialog_policy auto_dismiss; hermes config set security.website_blocklist.enabled true'
          sudo -u hermes -H bash -lc \
            'cd /home/hermes/.hermes/hermes-agent; venv/bin/python -c "import yaml; p=\"/home/hermes/.hermes/config.yaml\"; c=yaml.safe_load(open(p)) or {}; w=c.setdefault(\"security\", {}).setdefault(\"website_blocklist\", {}); w[\"enabled\"]=True; w[\"domains\"]=[\"localhost\",\"127.*\",\"0.0.0.0\",\"10.*\",\"100.64.*\",\"169.254.*\",\"172.16.*\",\"172.17.*\",\"172.18.*\",\"172.19.*\",\"172.20.*\",\"172.21.*\",\"172.22.*\",\"172.23.*\",\"172.24.*\",\"172.25.*\",\"172.26.*\",\"172.27.*\",\"172.28.*\",\"172.29.*\",\"172.30.*\",\"172.31.*\",\"192.168.*\",\"instance-data.ec2.internal\",\"metadata.google.internal\",\"*.compute.internal\",\"*.ec2.internal\",\"*.local\",\"*.lan\",\"*.internal\"]; open(p,\"w\").write(yaml.safe_dump(c, sort_keys=False))"'
          sudo -u hermes -H bash -lc \
            'export PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin; hermes tools enable browser --platform cli; hermes tools enable browser --platform telegram; hermes config check'

          sudo -u hermes -H env \
            HERMES_DOCKER_BINARY=/usr/bin/podman \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes config set terminal.backend docker
          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes config set terminal.docker_network false
          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes config set terminal.container_memory 1024
          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes config set terminal.container_disk 0
          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes config set terminal.docker_shm_size 256m
          sudo -u hermes -H bash -lc '
            export PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
            hermes config set terminal.container_cpu 1
            hermes config set terminal.container_persistent true
            hermes config set terminal.docker_mount_cwd_to_workspace false
            hermes config set terminal.home_mode auto
            hermes config set terminal.lifetime_seconds 300
            hermes config set terminal.timeout 180
            hermes config set agent.max_turns 90
            hermes config set agent.reasoning_effort medium
            hermes config set agent.verbose false
          '

          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes config set memory.memory_enabled true
          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes config set memory.user_profile_enabled true
          sudo -u hermes -H bash -lc '
            export PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
            hermes config set memory.flush_min_turns 6
            hermes config set memory.memory_char_limit 2200
            hermes config set memory.nudge_interval 10
            hermes config set memory.user_char_limit 1375
            hermes config set terminal.cwd .
          '
          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes tools enable memory
          sudo -u hermes -H bash -lc '
            export PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
            for platform in cli telegram; do
              hermes tools enable file --platform "$platform"
              hermes tools enable terminal --platform "$platform"
              hermes tools enable browser --platform "$platform"
              hermes tools enable memory --platform "$platform"
            done
          '

          if [ -n '${HermesStateBackupBucket}' ]; then
            install -d -m 0700 -o hermes -g hermes /home/hermes/.restore
            /usr/local/bin/aws s3 cp \
              's3://${HermesStateBackupBucket}/${HermesStateBackupKey}' \
              /home/hermes/.restore/hermes-state.tar.gz \
              --region '${AWS::Region}' \
              --only-show-errors
            /home/hermes/.hermes/hermes-agent/venv/bin/python -c '
          import pathlib
          import tarfile

          archive = "/home/hermes/.restore/hermes-state.tar.gz"
          destination = "/home/hermes/.hermes"
          allowed_roots = {"memories", "sessions", "workspace"}
          with tarfile.open(archive, "r:gz") as source:
              for member in source.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not path.parts or path.parts[0] not in allowed_roots:
                      raise SystemExit(f"unsafe or unsupported state path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"links and device entries are not allowed: {member.name}")
              source.extractall(destination)
          '
            chown -R hermes:hermes \
              /home/hermes/.hermes/memories \
              /home/hermes/.hermes/sessions \
              /home/hermes/.hermes/workspace 2>/dev/null || true
            rm -f /home/hermes/.restore/hermes-state.tar.gz
          fi

          cat >/usr/local/sbin/hermes-sync-runtime-config <<'RUNTIME_WRAPPER_EOF'
          #!/bin/bash
          set -euo pipefail
          runtime_script="$(mktemp)"
          trap 'rm -f "$runtime_script"' EXIT
          /usr/local/bin/aws cloudformation describe-stack-resource \
            --region '${AWS::Region}' \
            --stack-name '${AWS::StackName}' \
            --logical-resource-id HermesInstance \
            --query StackResourceDetail.Metadata \
            --output json | jq -er 'fromjson.RuntimeConfigScript' >"$runtime_script"
          chmod 0700 "$runtime_script"
          "$runtime_script"
          RUNTIME_WRAPPER_EOF
          chmod 0755 /usr/local/sbin/hermes-sync-runtime-config
          chown root:root /usr/local/sbin/hermes-sync-runtime-config
          sudo -u hermes -H env \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /usr/local/sbin/hermes-sync-runtime-config

          sudo -u hermes -H env HERMES_DOCKER_BINARY=/usr/bin/podman \
            podman pull docker.io/nikolaik/python-nodejs:python3.11-nodejs20

          sudo -u hermes -H env \
            PATH=/home/hermes/.hermes/node:/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            bash -lc \
              'cd /home/hermes/.hermes/hermes-agent; npm ci --workspace web --silent --prefer-offline; npm run build --workspace web'

          HERMES_UID="$(id -u hermes)"
          systemctl start "user@$HERMES_UID.service"

          sudo -u hermes -H env \
            XDG_RUNTIME_DIR="/run/user/$HERMES_UID" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$HERMES_UID/bus" \
            HERMES_DOCKER_BINARY=/usr/bin/podman \
            PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
            /home/hermes/.local/bin/hermes gateway install \
              --force \
              --start-now \
              --start-on-login

          install -d -m 0755 -o hermes -g hermes \
            /home/hermes/.config/systemd/user/hermes-gateway.service.d
          cat >/home/hermes/.config/systemd/user/hermes-gateway.service.d/10-runtime-config.conf <<EOF
          [Unit]
          $([ '${GitCodingEnabled}' = true ] && printf '%s\n' 'Requires=hermes-credential-provisioner.service' 'After=hermes-credential-provisioner.service')

          [Service]
          ExecStartPre=/usr/local/sbin/hermes-sync-runtime-config
          EOF
          chown hermes:hermes \
            /home/hermes/.config/systemd/user/hermes-gateway.service.d/10-runtime-config.conf
          sudo -u hermes -H env \
            XDG_RUNTIME_DIR="/run/user/$HERMES_UID" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$HERMES_UID/bus" \
            systemctl --user daemon-reload
          sudo -u hermes -H env \
            XDG_RUNTIME_DIR="/run/user/$HERMES_UID" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$HERMES_UID/bus" \
            systemctl --user restart hermes-gateway.service

          cat >/etc/systemd/system/hermes-dashboard.service <<EOF
          [Unit]
          Description=Hermes Agent Dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=hermes
          Group=hermes
          WorkingDirectory=/home/hermes/.hermes
          Environment="HOME=/home/hermes"
          Environment="USER=hermes"
          Environment="LOGNAME=hermes"
          Environment="XDG_RUNTIME_DIR=/run/user/$HERMES_UID"
          Environment="DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$HERMES_UID/bus"
          Environment="HERMES_HOME=/home/hermes/.hermes"
          Environment="HERMES_DOCKER_BINARY=/usr/bin/podman"
          Environment="VIRTUAL_ENV=/home/hermes/.hermes/hermes-agent/venv"
          Environment="PATH=/home/hermes/.hermes/node:/home/hermes/.local/bin:/home/hermes/.hermes/hermes-agent/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          ExecStartPre=/usr/bin/test -f /home/hermes/.hermes/hermes-agent/hermes_cli/web_dist/index.html
          ExecStart=/home/hermes/.hermes/hermes-agent/venv/bin/python -m hermes_cli.main dashboard --host 127.0.0.1 --port 9119 --no-open --skip-build
          Restart=always
          RestartSec=5
          KillMode=mixed
          KillSignal=SIGTERM
          TimeoutStopSec=30
          StandardOutput=journal
          StandardError=journal
          UMask=0077

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now hermes-dashboard.service

          sudo -u hermes -H env \
            XDG_RUNTIME_DIR="/run/user/$HERMES_UID" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$HERMES_UID/bus" \
            systemctl --user is-active --quiet hermes-gateway.service
          systemctl is-active --quiet hermes-dashboard.service
          for health_attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9119/api/health >/dev/null; then
              break
            fi
            if [ "$health_attempt" -eq 60 ]; then
              echo "Dashboard health check did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:9120/healthz >/dev/null
          if [ -n '${PersonalToolsClientTokenSecretArn}' ]; then
            sudo -u hermes -H env \
              PATH=/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin \
              /home/hermes/.local/bin/hermes mcp test personal_tools
          fi

          touch /home/hermes/.bootstrap-complete
          chown hermes:hermes /home/hermes/.bootstrap-complete
          trap - ERR
          signal_stack SUCCESS
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Component
          Value: agent-runtime

Outputs:
  InstanceId:
    Description: EC2 instance to target with AWS Systems Manager Session Manager.
    Value: !Ref HermesInstance

  Region:
    Description: AWS Region where the stack was deployed.
    Value: !Ref AWS::Region

  ConnectCommand:
    Description: Run this command locally to open a shell without SSH.
    Value: !Sub aws ssm start-session --target ${HermesInstance} --region ${AWS::Region}

  InstanceRoleArn:
    Description: Runtime role ARN. Use this when another stack must grant the rebuilt Hermes host access.
    Value: !GetAtt HermesInstanceRole.Arn

  PinnedAmiId:
    Description: Exact AMI used for this rebuild.
    Value: !Ref AmiId

  PinnedHermesGitRef:
    Description: Exact Hermes source revision used for this rebuild.
    Value: !Ref HermesGitRef

  TelegramStatus:
    Description: Whether this host was intentionally configured to start the production Telegram channel.
    Value: !Ref TelegramEnabled
