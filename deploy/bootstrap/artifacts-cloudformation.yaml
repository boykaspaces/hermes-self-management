AWSTemplateFormatVersion: "2010-09-09"
Description: Private versioned S3 bucket for immutable Hermes deployment artifacts.

Parameters:
  ProjectTag:
    Type: String
    Default: hermes-self-management
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9_.:/+=@-]{1,126}$'
    Description: Neutral project tag applied to the artifact bucket.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Component
          Value: bootstrap-artifacts

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  ArtifactBucketName:
    Description: Private bucket used by the runtime-bundle and template publishers.
    Value: !Ref ArtifactBucket

  ArtifactBucketArn:
    Description: ARN of the retained artifact bucket.
    Value: !GetAtt ArtifactBucket.Arn

  Region:
    Description: Region containing the artifact bucket.
    Value: !Ref AWS::Region
